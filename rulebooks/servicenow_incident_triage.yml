---
- name: ServiceNow Incident Triage with AI Fallback
  hosts: all
  sources:
    - servicenow.itsm.records:
        table: incident
        interval: 30
        sysparm_query: "active=true^state=1^work_notesNOT LIKE[AAP-REVIEWED]"
        remote_servicenow_timezone: "US/Eastern"

  match_multiple_rules: false

  rules:
    # --- Known Issue: Critical Application Outage ---
    - name: Application Outage - Auto Restart Services
      condition: >
        event.category == "software" and
        event.subcategory == "application" and
        (event.priority == "1" or event.priority == "2")
      actions:
        - run_workflow_template:
            name: Application Emergency Restart
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                configuration_item: "{{ event.configuration_item | default('') }}"
                business_service: "{{ event.business_service | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Database Performance ---
    - name: Database Performance - Run Optimization
      condition: >
        event.category == "database" and
        event.subcategory == "performance"
      actions:
        - run_job_template:
            name: Database Performance Tuning
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                target_database: "{{ event.configuration_item | default('') }}"
                cmdb_ci: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Storage Capacity ---
    - name: Storage Capacity Critical - Auto Cleanup
      condition: >
        event.category == "storage" and
        event.subcategory == "capacity"
      actions:
        - run_job_template:
            name: Storage Cleanup and Archival
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                storage_device: "{{ event.configuration_item | default('') }}"
                cmdb_ci: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Network Connectivity ---
    - name: Network Connectivity - Restart Interface
      condition: >
        event.category == "network" and
        event.subcategory == "connectivity"
      actions:
        - run_job_template:
            name: Network Interface Restart
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                affected_device: "{{ event.configuration_item | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Security - Brute Force ---
    - name: Security - Block Brute Force Attack
      condition: >
        event.category == "security" and
        event.subcategory == "authentication" and
        event.short_description is search("(?i)brute force|failed login")
      actions:
        - run_job_template:
            name: Firewall Block Malicious IP
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                firewall_ci: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: SSL Certificate Expiry ---
    - name: Certificate Expiring - Auto Renew
      condition: >
        event.category == "security" and
        event.subcategory == "certificates"
      actions:
        - run_job_template:
            name: Certificate Auto Renewal
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                cert_manager: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Backup Failures ---
    - name: Backup Failure - Retry with Cleanup
      condition: >
        event.category == "backup" and
        event.subcategory == "job failure"
      actions:
        - run_job_template:
            name: Backup Cleanup and Retry
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                backup_server: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- Known Issue: Kubernetes Pod Issues ---
    - name: Kubernetes Pod CrashLoop - Restart
      condition: >
        event.category == "platform" and
        event.subcategory == "kubernetes"
      actions:
        - run_job_template:
            name: Kubernetes Pod Recovery
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                k8s_cluster: "{{ event.configuration_item | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"

    # --- AI FALLBACK: Unmatched incidents go to AI for triage ---
    - name: AI Triage - Evaluate Unmatched Incident
      condition: event.number is defined
      actions:
        - run_job_template:
            name: AI Triage and Analysis from ServiceNow
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                category: "{{ event.category | default('') }}"
                subcategory: "{{ event.subcategory | default('') }}"
                priority: "{{ event.priority | default('') }}"
                configuration_item: "{{ event.configuration_item | default('') }}"
                cmdb_ci: "{{ event.cmdb_ci | default('') }}"
                short_description: "{{ event.short_description | default('') }}"
                description: "{{ event.description | default('') }}"
                business_service: "{{ event.business_service | default('') }}"
        - run_job_template:
            name: SERVICENOW / Add Enrichment Note
            organization: Default
            job_args:
              extra_vars:
                incident_number: "{{ event.number }}"
